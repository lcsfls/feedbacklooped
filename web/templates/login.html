{{define "title"}}Log in · {{.S.Title}}{{end}}
{{define "content"}}
<section class="narrow tight">
  <div class="card form">
    <h1>Log in</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="un">Username</label>
        <input id="un" name="username" type="text" value="{{.NewUsername}}" required autocomplete="username" {{if not .NewUsername}}autofocus{{end}}>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" name="password" type="password" required autocomplete="current-password" {{if .NewUsername}}autofocus{{end}}>
      </div>
      <div class="actions"><button class="btn primary">Log in</button></div>
    </form>
  </div>
</section>
{{end}}
