{{define "title"}}Setup · {{.S.Title}}{{end}}
{{define "content"}}
<section class="narrow">
  <div class="card form">
    <h1>Setup</h1>
    <p>Create the first admin account. Do this right after the first start: until an account exists, anyone can open this page.</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="post" action="/admin/setup">
      <div class="field">
        <label for="title">Name of the feedback portal</label>
        <input id="title" name="title" type="text" value="{{.S.Title}}" maxlength="80">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="un">Username</label>
          <input id="un" name="username" type="text" value="{{or .NewUsername "admin"}}" required autocomplete="username" pattern="[a-zA-Z0-9][a-zA-Z0-9._\-]{1,31}">
        </div>
        <div class="field">
          <label for="dn">Display name <span class="opt">(optional)</span></label>
          <input id="dn" name="display_name" type="text" value="{{.NewDisplay}}" maxlength="60" placeholder="e.g. Alex">
        </div>
      </div>
      <div class="grid2">
        <div class="field">
          <label for="pw">Password <span class="opt">(min. 10 characters)</span></label>
          <input id="pw" name="password" type="password" minlength="10" required autocomplete="new-password">
        </div>
        <div class="field">
          <label for="pw2">Repeat password</label>
          <input id="pw2" name="password2" type="password" minlength="10" required autocomplete="new-password">
        </div>
      </div>
      <div class="actions"><button class="btn primary">Create account</button></div>
    </form>
  </div>
</section>
{{end}}
