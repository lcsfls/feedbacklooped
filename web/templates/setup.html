{{define "title"}}Setup · {{.S.Title}}{{end}}
{{define "content"}}
<section class="narrow">
  <div class="card form">
    <h1>Setup</h1>
    <p>Set the admin password you will use to manage the board. Do this right after the first start: until a password is set, anyone can open this page.</p>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="post" action="/admin/setup">
      <div class="field">
        <label for="title">Name of the feedback portal</label>
        <input id="title" name="title" type="text" value="{{.S.Title}}" maxlength="80">
      </div>
      <div class="field">
        <label for="pw">Admin password <span class="opt">(min. 10 characters)</span></label>
        <input id="pw" name="password" type="password" minlength="10" required autocomplete="new-password">
      </div>
      <div class="field">
        <label for="pw2">Repeat password</label>
        <input id="pw2" name="password2" type="password" minlength="10" required autocomplete="new-password">
      </div>
      <div class="actions"><button class="btn primary">Set up</button></div>
    </form>
  </div>
</section>
{{end}}
